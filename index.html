<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abhisek Sahu | Video Editor</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons -->

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #020b1d;
            color: white;
            overflow-x: hidden;
        }

        /* ---------- BACKGROUND ---------- */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #00aeff;
            filter: blur(180px);
            opacity: 0.08;
            top: -200px;
            left: -200px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #008cff;
            filter: blur(180px);
            opacity: 0.07;
            bottom: -200px;
            right: -200px;
            z-index: -1;
        }

        /* ---------- NAVBAR ---------- */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 7%;

            background: rgba(5, 19, 38, 0.82);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(255,255,255,0.08);

            z-index: 1000;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            color: #05aeff;
        }

        .logo span {
            color: white;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #c8d0dc;
            text-decoration: none;
            font-size: 14px;
            transition: .3s;
        }

        nav a:hover {
            color: #08b4ff;
        }

        .hire-btn {
            background: linear-gradient(135deg, #00aaff, #0095ff);
            padding: 15px 30px;
            border-radius: 35px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 0 25px rgba(0,170,255,.25);
            transition: .3s;
        }

        .hire-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(0,170,255,.45);
        }

        /* ---------- HERO ---------- */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 70px;
        }

        .hero-content {
            max-width: 1000px;
        }

        .small-title {
            color: #05aeff;
            letter-spacing: 5px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(45px, 8vw, 90px);
            line-height: 1.05;
            font-weight: 800;
        }
