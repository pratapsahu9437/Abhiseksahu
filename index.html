
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abhisek Sahu | Video Editor</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #020b1d;
            color: white;
            overflow-x: hidden;
        }

        /* Background Glow */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #00aeff;
            filter: blur(180px);
            opacity: 0.08;
            top: -200px;
            left: -200px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #008cff;
            filter: blur(180px);
            opacity: 0.07;
            bottom: -200px;
            right: -200px;
            z-index: -1;
        }


        /* ================= NAVBAR ================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 7%;

            background: rgba(5, 19, 38, 0.85);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(255,255,255,0.08);

            z-index: 1000;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            color: #05aeff;
        }

        .logo span {
            color: white;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #c8d0dc;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #08b4ff;
        }

        .hire-btn {
            background: linear-gradient(135deg, #00aaff, #0095ff);
            padding: 15px 30px;
            border-radius: 35px;

            color: white;
            text-decoration: none;
            font-weight: 600;

            box-shadow: 0 0 25px rgba(0,170,255,.25);

            transition: 0.3s;
        }

        .hire-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(0,170,255,.45);
        }


        /* ================= HERO ================= */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 130px 20px 70px;
        }

        .hero-content {
            max-width: 950px;
        }

        .small-title {
            color: #05aeff;
            letter-spacing: 5px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(45px, 8vw, 85px);
            line-height: 1.05;
            font-weight: 800;
        }

        .hero h1 span {
            color: #04aeff;
        }


        /* ================= PROFILE PHOTO ================= */

        .profile-photo {
            width: 300px;
            height: 300px;

            margin: 35px auto;

            border-radius: 30px;

            overflow: hidden;

            border: 2px solid #00aeff;

            box-shadow:
                0 0 30px rgba(0,174,255,.25),
                0 0 80px rgba(0,174,255,.08);
        }

        .profile-photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        .hero p {
            max-width: 700px;

            margin: 25px auto;

            color: #aeb8c8;

            font-size: 18px;

            line-height: 1.8;
        }


        .hero-buttons {
            margin-top: 35px;

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }


        .outline-btn {
            border: 1px solid #08aeff;

            color: #08aeff;

            padding: 14px 28px;

            border-radius: 30px;

            text-decoration: none;

            transition: .3s;
        }

        .outline-btn:hover {
            background: #08aeff;
            color: white;
        }


        /* ================= SECTION ================= */

        section {
            padding: 100px 7%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 55px;
        }

        .section-title small {
            color: #00aeff;

            letter-spacing: 5px;

            font-weight: 600;
        }

        .section-title h2 {
            font-size: clamp(35px, 5vw, 55px);

            margin-top: 10px;
        }


        /* ================= ABOUT ================= */

        .about {
            max-width: 1100px;

            margin: auto;

            text-align: center;
        }

        .about p {
            color: #adb7c6;

            line-height: 2;

            font-size: 17px;
        }


        /* ================= STATS ================= */

        .stats {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 30px;

            max-width: 1100px;

            margin: auto;
        }

        .stat-card {
            background: rgba(18, 35, 56, .7);

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 28px;

            padding: 55px 25px;

            text-align: center;

            backdrop-filter: blur(15px);

            transition: .3s;
        }

        .stat-card:hover {
            transform: translateY(-8px);

            border-color: rgba(0,174,255,.4);
        }

        .stat-card h3 {
            font-size: 55px;

            color: #05aeff;
        }

        .stat-card p {
            color: #d4d9e1;

            font-size: 18px;

            margin-top: 10px;
        }


        /* ================= SERVICES ================= */

        .services {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 30px;
        }

        .service-card {
            padding: 45px 30px;

            border-radius: 25px;

            text-align: center;

            background: rgba(17, 33, 53, .72);

            border: 1px solid rgba(255,255,255,.08);

            transition: .35s;
        }

        .service-card:hover {
            transform: translateY(-10px);

            border-color: #00aeff;

            box-shadow:
                0 15px 50px rgba(0,174,255,.08);
        }

        .service-icon {
            width: 70px;
            height: 70px;

            margin: auto auto 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 20px;

            color: #00aeff;

            font-size: 30px;

            background: rgba(0,174,255,.08);

            border: 1px solid rgba(0,174,255,.3);
        }

        .service-card h3 {
            font-size: 23px;

            margin-bottom: 15px;
        }

        .service-card p {
            color: #aab4c3;

            line-height: 1.8;
        }


        /* ================= PORTFOLIO ================= */

        .portfolio {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 35px;

            max-width: 1100px;

            margin: auto;
        }


        .project {
            overflow: hidden;

            border-radius: 25px;

            background: rgba(18, 34, 55, .75);

            border: 1px solid rgba(255,255,255,.08);
        }

        .video-box
